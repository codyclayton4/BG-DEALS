<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>BG Deals</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f5f7;color:#111827}
header{background:#111827;color:white;padding:22px 18px 18px;position:sticky;top:0;z-index:5}
.logo{font-size:27px;font-weight:800}.sub{opacity:.72;font-size:13px;margin-top:2px}
.search{margin-top:15px;background:white;border:0;border-radius:13px;padding:13px 14px;width:100%;font-size:16px;outline:none}
main{padding:18px 15px 90px;max-width:700px;margin:auto}
h2{font-size:20px;margin:4px 0 12px}
.chips{display:flex;gap:8px;overflow:auto;padding-bottom:5px}
.chip{border:0;background:white;padding:9px 13px;border-radius:20px;white-space:nowrap;font-weight:600}
.chip.active{background:#111827;color:white}
.deal{background:white;border-radius:18px;margin:12px 0;padding:16px;box-shadow:0 2px 9px #0000000d;cursor:pointer}
.row{display:flex;justify-content:space-between;gap:12px}
.tag{font-size:12px;font-weight:700;color:#d97706}.title{font-size:18px;font-weight:800;margin:5px 0}
.biz{font-weight:650;color:#374151}.meta{font-size:13px;color:#6b7280;margin-top:8px}
.desc{font-size:14px;color:#4b5563;line-height:1.4;margin-top:8px}
.save{border:0;background:#f3f4f6;border-radius:12px;width:40px;height:40px;font-size:20px}
.save.on{background:#fee2e2}
nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:9px 5px calc(9px + env(safe-area-inset-bottom));z-index:9}
nav button{border:0;background:none;color:#6b7280;font-weight:650}.navactive{color:#111827!important}
.empty{text-align:center;color:#6b7280;padding:40px 15px}
.overlay{display:none;position:fixed;inset:0;background:#0008;z-index:20;overflow:auto;padding:18px}
.detail{background:white;border-radius:22px;max-width:700px;margin:20px auto;padding:22px;min-height:70vh}
.close{float:right;border:0;background:#f3f4f6;border-radius:12px;width:42px;height:42px;font-size:24px}
.detailtag{font-size:12px;font-weight:800;color:#d97706;padding-top:10px}
.detailtitle{font-size:28px;font-weight:850;margin:8px 0}.detailbiz{font-size:20px;font-weight:700;color:#374151}
.info{margin:22px 0;line-height:1.8;color:#4b5563}
.primary{width:100%;border:0;border-radius:14px;padding:15px;background:#111827;color:white;font-size:17px;font-weight:800}
.actions{display:flex;gap:10px;margin-top:10px}.actions button{flex:1;border:0;border-radius:12px;padding:12px;font-weight:700;background:#f3f4f6}
.claimcode{text-align:center;font-size:40px;font-weight:900;letter-spacing:3px;margin:28px 0}
</style>
</head>
<body>
<header>
<div class="logo">🔥 BG Deals</div><div class="sub">Bowling Green, Kentucky</div>
<input id="search" class="search" placeholder="Search deals or businesses…">
</header>

<main>
<h2>Browse deals</h2>
<div class="chips" id="chips"></div>
<section id="deals"></section>
</main>

<div id="overlay" class="overlay">
  <div class="detail">
    <button class="close" onclick="closeDetail()">×</button>
    <div id="detailContent"></div>
  </div>
</div>

<nav>
<button class="navactive" onclick="setTab('deals',this)">🏠<br>Deals</button>
<button onclick="setTab('saved',this)">❤️<br>Saved</button>
<button onclick="setTab('business',this)">🏪<br>Businesses</button>
</nav>

<script>
const data=[
{id:1,cat:"Food",biz:"BG Burger Co.",title:"2-for-1 Burger Tuesday",desc:"Buy one regular burger and get the second free. Dine-in only.",expires:"Today • 8 PM",dist:"1.2 mi"},
{id:2,cat:"Auto",biz:"Bowling Green Wash",title:"$8 Premium Wash",desc:"Premium exterior wash for $8 today.",expires:"Today • 6 PM",dist:"2.4 mi"},
{id:3,cat:"Beauty",biz:"Main Street Barber",title:"$5 Off Haircuts",desc:"Mention BG Deals when checking out.",expires:"Sep 22",dist:"0.8 mi"},
{id:4,cat:"Shopping",biz:"Local Finds",title:"20% Off Selected Items",desc:"In-store weekend promotion on selected merchandise.",expires:"Sep 27",dist:"3.1 mi"},
{id:5,cat:"Food",biz:"Taco House",title:"Taco Night Special",desc:"Three tacos plus a drink for $9.",expires:"Today • 9 PM",dist:"4.0 mi"}
];

let saved=JSON.parse(localStorage.getItem("bgSaved")||"[]");
let cat="All",tab="deals";
const cats=["All","Food","Auto","Beauty","Shopping","Entertainment","Services"];

function render(){
 const q=document.getElementById("search").value.toLowerCase();
 document.getElementById("chips").innerHTML=cats.map(c=>
   `<button class="chip ${cat===c?'active':''}" onclick="cat='${c}';render()">${c}</button>`
 ).join("");

 let arr=data.filter(d=>
   (cat==="All"||d.cat===cat) &&
   (d.title+" "+d.biz+" "+d.desc).toLowerCase().includes(q)
 );

 if(tab==="saved") arr=arr.filter(d=>saved.includes(d.id));

 if(tab==="business"){
   document.getElementById("deals").innerHTML=
   `<div class="deal">
     <div class="title">Own a Bowling Green business?</div>
     <div class="desc">Businesses will be able to create profiles and post deals directly in BG Deals.</div>
     <br><button class="primary" onclick="alert('Business posting will be added next.')">Post a Deal</button>
   </div>`;
   return;
 }

 document.getElementById("deals").innerHTML=arr.length ? arr.map(d=>
 `<article class="deal" onclick="openDetail(${d.id})">
   <div class="row">
     <div>
       <div class="tag">${d.cat.toUpperCase()}</div>
       <div class="title">${d.title}</div>
       <div class="biz">${d.biz}</div>
     </div>
     <button class="save ${saved.includes(d.id)?'on':''}" onclick="event.stopPropagation();toggle(${d.id})">${saved.includes(d.id)?'♥':'♡'}</button>
   </div>
   <div class="desc">${d.desc}</div>
   <div class="meta">📍 ${d.dist} &nbsp; • &nbsp; ⏰ ${d.expires}</div>
 </article>`).join("") : '<div class="empty">No deals found.</div>';
}

function openDetail(id){
 const d=data.find(x=>x.id===id);
 document.getElementById("detailContent").innerHTML=
 `<div class="detailtag">${d.cat.toUpperCase()}</div>
  <div class="detailtitle">${d.title}</div>
  <div class="detailbiz">${d.biz}</div>
  <div class="info">
    📍 <b>${d.dist}</b> away<br>
    ⏰ <b>${d.expires}</b><br>
    📍 Bowling Green, Kentucky<br><br>
    ${d.desc}
  </div>
  <button class="primary" onclick="claimDeal(${d.id})">🎟️ Claim Deal</button>
  <div class="actions">
    <button onclick="alert('Maps will be connected in the next update.')">🗺️ Directions</button>
    <button onclick="toggle(${d.id})">♡ Save</button>
  </div>`;
 document.getElementById("overlay").style.display="block";
}

function closeDetail(){
 document.getElementById("overlay").style.display="none";
}

function claimDeal(id){
 const d=data.find(x=>x.id===id);
 const code="BG-"+Math.floor(10000+Math.random()*90000);
 document.getElementById("detailContent").innerHTML=
 `<div class="detailtag">DEAL CLAIMED</div>
  <div class="detailtitle">${d.title}</div>
  <div class="detailbiz">${d.biz}</div>
  <div class="info">Show this code to the business to redeem your deal.</div>
  <div class="claimcode">${code}</div>
  <div class="info">Valid ${d.expires}. One use per customer.</div>
  <button class="primary" onclick="closeDetail()">Done</button>`;
}

function toggle(id){
 saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];
 localStorage.setItem("bgSaved",JSON.stringify(saved));
 render();
}

function setTab(t,el){
 tab=t;
 document.querySelectorAll("nav button").forEach(b=>b.classList.remove("navactive"));
 el.classList.add("navactive");
 render();
}

document.getElementById("search").addEventListener("input",render);
render();

if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
